name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Lint ausführen
        run: npm run lint

      - name: Build erstellen
        run: npm run build

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten prüfen (npm audit)
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code inkl. Git-Historie auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets suchen (Gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/path" zricethezav/gitleaks:latest detect --source="/path" --verbose

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Docker-Image bauen
        run: docker build -t shopping-list:scan .

      - name: Docker-Image scannen (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'shopping-list:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          severity: 'CRITICAL,HIGH'